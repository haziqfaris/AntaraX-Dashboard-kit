<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>AXLE sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="AXLE" style="width: 240px; min-height: 100%; box-sizing: border-box; background: #0C1B47; border-right: 1px solid rgba(157,184,255,.16); display: flex; flex-direction: column; gap: 4px; padding: 20px 14px 18px; font-family: Poppins, ui-sans-serif, system-ui, sans-serif; color: #B6C3EA; font-size: 14px; line-height: 1.5">
  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 4px 8px 12px; text-decoration: none">
    <img src="/_blob/24b37b892fd904da55a18f908e874613" alt="AntaraX" style="width: 30px; height: 30px">
    <span style="display: flex; flex-direction: column; line-height: 1.15">
      <span style="color: #EAF0FF; font-weight: 700; font-size: 17px; letter-spacing: .04em">AXLE</span>
      <span style="font-family: 'JetBrains Mono', monospace; color: #8E9CC9; font-size: 10px; letter-spacing: .12em; margin-top: 3px">REKA STAFF CONSOLE</span>
    </span>
  </a>

  <sc-if value="{{hasR8}}" hint-placeholder-val="{{true}}">
    <div role="tablist" aria-label="AXLE mode" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.10)">
      <a href="Main.dc.html" role="tab" aria-selected="{{dashSel}}" style="{{dashTab}}">Dashboard</a>
      <a href="R8.dc.html" role="tab" aria-selected="{{r8Sel}}" style="{{r8Tab}}">R8</a>
    </div>
    <div style="font-size: 11px; color: #8E9CC9; padding: 4px 8px 0">{{modeLine}}</div>
  </sc-if>

  <div style="display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 0 8px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: .12em; color: #8E9CC9">AXLE STANDARD</span>
    <span style="flex: 1; height: 1px; background: rgba(157,184,255,.16)"></span>
    <button type="button" onClick="{{allToggle}}" style="border: 0; background: transparent; color: #8E9CC9; font-family: inherit; font-size: 11px; cursor: pointer; padding: 2px 2px; text-decoration: underline">{{allLabel}}</button>
  </div>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
    <div style="margin-top: 6px; padding: 2px; border-radius: 12px; background: rgba(255,255,255,.035); border: 1px solid rgba(157,184,255,.10); display: flex; flex-direction: column; gap: 1px">
      <button type="button" onClick="{{g.toggle}}" aria-expanded="{{g.expanded}}" style="display: flex; align-items: center; gap: 8px; width: 100%; min-height: 38px; padding: 4px 8px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; text-align: left; font-family: inherit">
        <sc-if value="{{g.hasTile}}" hint-placeholder-val="{{false}}">
          <span style="width: 24px; height: 24px; border-radius: 7px; flex: none; display: flex; align-items: center; justify-content: center; background: {{g.tileBg}}"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{g.hue}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{g.icon}}"></path></svg></span>
        </sc-if>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <span style="{{g.titleStyle}}">{{g.label}}</span>
          <sc-if value="{{g.showPreview}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; color: #8E9CC9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.preview}}</span></sc-if>
        </span>
        <sc-if value="{{g.showRoll}}" hint-placeholder-val="{{false}}">
          <span aria-label="{{g.rollLabel}}" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; min-width: 20px; text-align: center; padding: 1px 6px; border-radius: 999px; background: #FB9800; color: #071233; font-weight: 600">{{g.roll}}</span>
        </sc-if>
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8E9CC9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex: none; transform: {{g.chevron}}"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <sc-if value="{{g.open}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; gap: 1px; padding: 0 0 4px">
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
            <a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">
              <span style="width: 9px; height: 9px; transform: rotate(45deg); border-radius: 1px; flex: none; background: {{it.intan}}"></span>
              <span style="flex: 1">{{it.label}}</span>
              <sc-if value="{{it.hasCount}}" hint-placeholder-val="{{false}}">
                <span aria-label="{{it.countLabel}}" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; min-width: 20px; text-align: center; padding: 1px 6px; border-radius: 999px; {{it.countStyle}}">{{it.count}}</span>
              </sc-if>
            </a>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </sc-for>

  <section aria-label="{{customLabel}}" style="margin-top: 16px; padding: 10px 6px 8px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px dashed rgba(157,184,255,.30); display: flex; flex-direction: column; gap: 1px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 6px 6px">
      <span style="width: 22px; height: 22px; border-radius: 6px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><img src="{{markUrl}}" alt="" style="max-width: 16px; max-height: 16px; display: block"></span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: .1em; color: #EAF0FF; text-transform: uppercase">{{product}} only</span>
    </div>
    <sc-for list="{{custom}}" as="it" hint-placeholder-count="2">
      <a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">
        <span style="width: 9px; height: 9px; transform: rotate(45deg); border-radius: 1px; flex: none; background: {{it.intan}}"></span>
        <span style="flex: 1">{{it.label}}</span>
        <sc-if value="{{it.hasCount}}" hint-placeholder-val="{{false}}">
          <span aria-label="{{it.countLabel}}" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; min-width: 20px; text-align: center; padding: 1px 6px; border-radius: 999px; {{it.countStyle}}">{{it.count}}</span>
        </sc-if>
      </a>
    </sc-for>
    <sc-if value="{{noCustom}}" hint-placeholder-val="{{false}}">
      <span style="font-size: 12px; color: #8E9CC9; padding: 2px 10px 4px">{{emptyLine}}</span>
    </sc-if>
  </section>

  <div style="margin-top: auto; padding: 16px 8px 0; border-top: 1px solid rgba(157,184,255,.16); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 34px; height: 34px; border-radius: 50%; background: #13255C; color: #EAF0FF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">{{initials}}</span>
      <span style="display: flex; flex-direction: column; line-height: 1.3">
        <span style="color: #EAF0FF; font-weight: 500">{{staffName}}</span>
        <span style="font-family: 'JetBrains Mono', monospace; color: #FB9800; font-size: 11px; font-weight: 600; letter-spacing: .08em">{{staffRung}}</span>
      </span>
    </div>
    <div style="font-size: 11px; color: #8E9CC9">Authorised REKA staff · every action is recorded</div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"Overview"},"mode":{"editor":"enum","options":["dashboard","r8"],"default":"dashboard"},"product":{"editor":"enum","options":["Janka","Yara","AX Frame","Angka","PLExyz Grid","Tinara"],"default":"Janka"},"staffName":{"editor":"text","default":"Aisyah Rahman"},"staffRung":{"editor":"text","default":"OPERATOR"},"initials":{"editor":"text","default":"AR"},"titles":{"editor":"enum","options":["combined","blue","tiles","hues"],"default":"combined","section":"Group titles"},"$preview":{"width":240,"height":1400}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { toggled: {}, allClosed: false }; }
  renderVals() {
    var self = this;
    var active = this.props.active ?? 'Overview';
    var product = this.props.product ?? 'Janka';
    // Every product has R8 (owner, 15 Oct 2026). full: it runs machinery of its own, so R8 adds Incidents. observe: its Observe pages, once their backend exists.
    var P = {
      'Janka': { mark: '/_blob/8757545247be33f643590d3dcfee0bb8', full: true, observe: [], d: [['Forecast accuracy'], ['Reference library', 5, 'loud'], ['Learning']], r: [['Nightly forecast']] },
      'Yara': { mark: '/_blob/b5ffef229482a50345391de29cbfee0f', full: false, observe: [], d: [['Data integrity', 2, 'loud'], ['Modules'], ['Status API']], r: [] },
      'AX Frame': { mark: '/_blob/14ea05d2ed6655f1a0c7e460cb8fce0f', full: true, observe: [['Probes and network'], ['Visual']], d: [['AI connections'], ['Customer health', 4, 'loud'], ['Catalog']], r: [] },
      'Angka': { mark: '/_blob/74ac0d107d262dbf7252396ab8eb230b', full: true, observe: [], d: [['Lapis'], ['Weekly brief']], r: [['Runs']] },
      'PLExyz Grid': { mark: '/_blob/39777292a881530041e7c4ac04e939a8', full: false, observe: [], d: [], r: [] },
      'Tinara': { mark: '/_blob/cdaa47e69d5d2a13a1fb2a99e7572df9', full: true, observe: [], d: [['Scoring & metrics'], ['Data sources'], ['Intelligence ledger']], r: [['Data pipelines']] }
    };
    var p = P[product] || P['Janka'];
    var r8 = (this.props.mode ?? 'dashboard') === 'r8';
    var PAGES = r8
      ? { 'Overview': 'R8.dc.html', 'Incidents': 'Incidents.dc.html', 'Troubleshoot': 'Troubleshoot.dc.html', 'Jobs': 'Jobs.dc.html', 'Providers': 'Providers.dc.html', 'Services': 'Health.dc.html', 'Configuration': 'Configuration.dc.html' }
      : { 'Overview': 'Main.dc.html', 'Organisations': 'Organisations.dc.html', 'Models & keys': 'ModelsKeys.dc.html', 'Live trace': 'LiveTrace.dc.html', 'Plans & features': 'PlansFeatures.dc.html', 'Costs': 'Costs.dc.html', 'Settings': 'Settings.dc.html', 'Audit': 'Audit.dc.html', 'Staff': 'Staff.dc.html', 'Health': 'Health.dc.html' };
    var STD;
    if (r8) {
      STD = [
        ['Command', p.full ? [['Overview'], ['Incidents', 2, 'loud'], ['Troubleshoot']] : [['Overview'], ['Troubleshoot']]],
        ['Observe', p.observe],
        ['System', [['Jobs', 1, 'loud'], ['Providers', 1, 'loud'], ['Services']]],
        ['Control and diagnostics', [['Configuration', 1, 'loud'], ['Operations audit']]]
      ];
    } else {
      var ops = [['Errors', 3, 'loud'], ['Alerts'], ['Backups'], ['Access']];
      STD = [
        ['Watch', [['Overview', 5, 'loud'], ['Adoption'], ['Feedback', 2, 'loud']]],
        ['Organisations', [['Organisations', 48, 'quiet'], ['Members'], ['Invitations'], ['Requests', 1, 'loud'], ['Support']]],
        ['AI', [['Models & keys'], ['AI usage'], ['Live trace'], ['Prompts & quality']]],
        ['Money', [['Plans & features'], ['Billing'], ['Costs']]],
        ['Platform', [['Announcements'], ['Help content'], ['Demo'], ['Settings']]],
        ['Operations', ops],
        ['Trail', [['Audit'], ['Staff'], ['AXLE guide']]]
      ];
    }
    function item(it) {
      var on = active === it[0];
      var loud = it[2] === 'loud';
      var linked = !!PAGES[it[0]];
      return {
        label: it[0], href: PAGES[it[0]] || '#',
        current: on ? 'page' : undefined,
        intan: on ? '#FB9800' : 'transparent',
        style: 'display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:10px;font-size:14px;text-decoration:none;' +
          (on ? 'background:rgba(251,152,0,.16);color:#FB9800;font-weight:600;' : (linked ? 'color:#EAF0FF;' : 'color:#B6C3EA;')),
        hasCount: it[1] != null, count: it[1],
        countLabel: it[1] + (loud ? ' need a person' : ' in total'),
        countStyle: loud ? 'background:#FB9800;color:#071233;font-weight:600;' : 'background:#13255C;color:#B6C3EA;'
      };
    }
    // Groups are cards that fold. The current page's group opens on arrival; a folded card lists its pages
    // in one grey line and rolls up what needs a person. In AXLE the choice is remembered per staff member.
    // titles: 'combined' (the standard, owner 15 Oct 2026) an icon tile and the title in the group's colour;
    // kept for comparison: 'blue' one title colour, 'tiles' icon tile with a white title, 'hues' coloured title only.
    var titles = this.props.titles ?? 'combined';
    var HUE = { 'Watch': '#7FA4FF', 'Organisations': '#5ED3C9', 'AI': '#B7A8FF', 'Money': '#E3C25E', 'Platform': '#F2A0CB', 'Operations': '#8FD3FF', 'Trail': '#C4CDE8',
      'Command': '#7FA4FF', 'Observe': '#5ED3C9', 'System': '#B7A8FF', 'Control and diagnostics': '#C4CDE8' };
    var ICON = {
      'Watch': 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 100 6 3 3 0 000-6z',
      'Organisations': 'M4 21V5l8-3 8 3v16M9 21v-4h6v4M8 8h.01M12 8h.01M16 8h.01M8 12h.01M12 12h.01M16 12h.01',
      'AI': 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z',
      'Money': 'M12 2a10 10 0 100 20 10 10 0 000-20zM15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2',
      'Platform': 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M16 4v4M10 10v4M18 16v4',
      'Operations': 'M3 12h4l3-7 4 14 3-7h4',
      'Trail': 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
      'Command': 'M5 21V4M5 4h11l-2 4 2 4H5',
      'Observe': 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 100 6 3 3 0 000-6z',
      'System': 'M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01',
      'Control and diagnostics': 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M16 4v4M10 10v4M18 16v4'
    };
    function hexA(h, a) { var n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }
    var START_CLOSED = r8 ? [] : ['Organisations', 'Money', 'Platform', 'Trail'];
    var toggled = this.state.toggled, allClosed = this.state.allClosed;
    var groups = STD.filter(function (g) { return g[1].length > 0; }).map(function (g) {
      var hasActive = g[1].some(function (it) { return it[0] === active; });
      var dflt = allClosed ? !hasActive : (START_CLOSED.indexOf(g[0]) >= 0 && !hasActive);
      var closed = toggled[g[0]] !== undefined ? toggled[g[0]] : dflt;
      var roll = g[1].reduce(function (n, it) { return n + (it[2] === 'loud' ? it[1] : 0); }, 0);
      var hue = HUE[g[0]] || '#7FA4FF';
      var titleStyle = titles === 'combined' ? 'font-size:13px;font-weight:600;color:' + hue + ';'
        : titles === 'tiles' ? 'font-size:13px;font-weight:600;color:#EAF0FF;'
        : 'font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:' + (titles === 'hues' ? hue : '#7FA4FF') + ';';
      return { label: g[0], items: g[1].map(item), open: !closed, expanded: closed ? 'false' : 'true',
        chevron: closed ? 'none' : 'rotate(90deg)', showRoll: closed && roll > 0, roll: roll, rollLabel: roll + ' need a person',
        showPreview: closed, preview: g[1].map(function (it) { return it[0]; }).join(' · '),
        titleStyle: titleStyle, hasTile: titles === 'tiles' || titles === 'combined', hue: hue, tileBg: hexA(hue, 0.16), icon: ICON[g[0]] || '',
        toggle: function () { var t = Object.assign({}, self.state.toggled); t[g[0]] = !closed; self.setState({ toggled: t }); } };
    });
    var allLabel = groups.every(function (g) { return g.open; }) ? 'Collapse all' : 'Expand all';
    var allToggle = function () {
      if (allLabel === 'Collapse all') self.setState({ allClosed: true, toggled: {} });
      else { var t = {}; groups.forEach(function (g) { t[g.label] = false; }); self.setState({ allClosed: false, toggled: t }); }
    };
    var custom = (r8 ? p.r : p.d).map(item);
    var TAB = 'display:flex;align-items:center;justify-content:center;min-height:36px;border-radius:9px;font-size:13px;text-decoration:none;';
    return {
      hasR8: true, groups: groups, allLabel: allLabel, allToggle: allToggle, custom: custom, noCustom: custom.length === 0, product: product, markUrl: p.mark,
      customLabel: product + ' only',
      emptyLine: 'No ' + product + '-only pages ' + (r8 ? 'in R8' : 'here') + '. Everything above is the standard.',
      dashSel: r8 ? 'false' : 'true', r8Sel: r8 ? 'true' : 'false',
      dashTab: TAB + (r8 ? 'color:#B6C3EA;' : 'background:#FB9800;color:#071233;font-weight:600;'),
      r8Tab: TAB + (r8 ? 'background:#FB9800;color:#071233;font-weight:600;' : 'color:#B6C3EA;'),
      modeLine: r8 ? (p.full ? 'R8 Full · is the platform okay, and why did this fail?' : 'R8 Base · is the platform okay, and why did this fail?') : 'How is the product doing, and who needs us?',
      staffName: this.props.staffName ?? 'Aisyah Rahman', staffRung: this.props.staffRung ?? 'OPERATOR', initials: this.props.initials ?? 'AR'
    };
  }
}
</script>
</body>
</html>
