<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Sign in to AXLE · Janka</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#071233}
.axs :focus-visible{outline:2px solid #4D84FE;outline-offset:3px}
.axs input::placeholder{color:#8E9CC9}
.axs-dots{position:absolute;inset:-120px;pointer-events:none;
  background-image:radial-gradient(circle,rgba(157,184,255,.20) 1px,transparent 1.2px),radial-gradient(circle,rgba(157,184,255,.10) 1.6px,transparent 1.9px);
  background-size:24px 24px,120px 120px;
  -webkit-mask-image:radial-gradient(ellipse 75% 65% at 50% 45%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse 75% 65% at 50% 45%,#000 30%,transparent 75%);
  animation:axs-drift 60s linear infinite}
@keyframes axs-drift{from{transform:translate(0,0)}to{transform:translate(120px,120px)}}
.axs-scan{position:absolute;left:0;right:0;height:140px;top:-140px;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(77,132,254,.12) 55%,rgba(77,132,254,.06) 80%,transparent);
  animation:axs-sweep 7s ease-in-out infinite}
@keyframes axs-sweep{0%{top:-140px;opacity:0}12%{opacity:1}55%{top:100%;opacity:.9}70%,100%{top:100%;opacity:0}}
.axs-dot{width:6px;height:6px;border-radius:50%;background:rgba(182,195,234,.7);animation:axs-pulse 2.4s infinite}
@keyframes axs-pulse{0%,100%{box-shadow:0 0 0 0 rgba(182,195,234,.45)}55%{box-shadow:0 0 0 6px rgba(182,195,234,0)}}
.axs-primary:hover{background:#2A6BFA}
@media (prefers-reduced-motion:reduce){.axs-dots,.axs-dot{animation:none!important}.axs-scan{display:none}}
</style>
</helmet>
<main class="axs" style="position: relative; min-height: 100vh; box-sizing: border-box; display: grid; place-items: center; padding: 40px 16px; overflow: hidden; background: #071233; color: #EAF0FF; font-family: Poppins, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 1.5">
  <div class="axs-dots" aria-hidden="true"></div>
  <div class="axs-scan" aria-hidden="true"></div>

  <div style="position: relative; z-index: 2; width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 22px">
    <section aria-labelledby="axs-title" style="width: 100%; box-sizing: border-box; background: #0C1B47; border: 1px solid rgba(157,184,255,.16); border-radius: 20px; padding: 40px 36px 30px; box-shadow: 0 24px 70px -20px rgba(0,0,0,.75); display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; margin-bottom: 8px">
        <svg viewBox="0 0 1254 1254" width="48" height="48" role="img" aria-label="AntaraX" style="margin-bottom: 10px">
          <defs><mask id="axs-hole" maskUnits="userSpaceOnUse" x="-500" y="-500" width="2000" height="2000"><rect x="-500" y="-500" width="2000" height="2000" fill="#ffffff"></rect><circle cx="357.5" cy="441" r="95" fill="#000000"></circle></mask></defs>
          <g transform="translate(268,265)" fill="#FFFFFF"><g mask="url(#axs-hole)">
            <path d="M358.5,2.141C359.936,2.174 437.254,-3.156 477.137,76.686C509.428,141.329 574.707,261.686 575.624,265.474C576.014,267.082 575.932,267.834 559.247,278.103C552.424,282.302 513.444,306.291 474.816,331.965C470.303,334.965 469.964,332.657 463.912,327.062C378.243,247.856 249.757,291.305 215.863,382.635C189.351,454.074 218.81,493.94 217.198,499.402C216.36,502.24 158.586,542.715 153.396,546.351C128.168,564.025 21.899,641.538 21.507,641.571C19.421,641.746 -12.816,582.844 10.721,518.585C17.01,501.415 18.108,501.939 117.035,316.246C208.447,144.657 206.46,143.783 215.33,129.41C242.546,85.308 256.42,5.579 358.5,2.141Z"></path>
            <path d="M712.86,569.5C707.684,722.194 528.709,765.521 460.343,658.586C459.105,656.65 433.325,611.191 432.989,610.27C420.331,575.581 451.294,563.602 457.519,557.52C463.894,551.291 527.04,502.845 510.067,408.603C505.629,383.961 489.392,360.548 491.623,358.65C514.084,339.539 576.187,291.421 583.613,285.668C587.225,282.869 587.367,286.648 611.755,335.375C698.625,508.943 711.316,511.477 712.86,569.5Z"></path>
            <path d="M287.887,591.471C288.818,596.895 290.465,606.499 260.913,654.752C227.271,709.681 186.389,713.484 160.44,717.229C125.147,722.323 65.998,701.276 43.274,672.672C36.725,664.429 28.404,660.902 35.892,655.991C45.966,649.386 147.902,582.543 162.336,574.231C168.802,570.508 232.697,527.224 234.127,528.97C252.829,551.803 253.003,551.581 276.439,569.592C286.859,577.601 287.275,586.403 287.887,591.471Z"></path>
          </g></g>
        </svg>
        <h1 id="axs-title" style="margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 26px; font-weight: 700; letter-spacing: 6px; margin-left: 6px; color: #EAF0FF; line-height: 1.2">AXLE</h1>
        <p style="margin: 0; font-size: 12px; color: #B6C3EA">{{product}} · REKA staff console</p>
      </div>

      <sc-if value="{{isDenied}}" hint-placeholder-val="{{false}}">
        <div role="alert" style="padding: 10px 13px; border-radius: 10px; background: rgba(240,68,56,.14); border: 1px solid rgba(240,68,56,.4); color: #FDA29B; font-size: 12.5px; line-height: 1.55">This account isn't on the REKA staff list, so you've been signed out. <a href="#" style="color: #FDA29B; text-decoration: underline">Sign in to {{product}}</a> instead.</div>
      </sc-if>

      <sc-if value="{{isSignIn}}" hint-placeholder-val="{{true}}">
        <button type="button" onClick="{{google}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 44px; border-radius: 12px; border: 0; background: #FFFFFF; color: #0B1B4F; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"></path><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6.1z"></path><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.2 1.5-5 2.3-8.2 2.3-6.2 0-11.5-4.1-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"></path></svg>
          <span>{{googleLabel}}</span>
        </button>
        <span style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #8E9CC9"><span style="flex: 1; height: 1px; background: rgba(157,184,255,.16)"></span>or<span style="flex: 1; height: 1px; background: rgba(157,184,255,.16)"></span></span>
        <form onSubmit="{{submit}}" style="display: flex; flex-direction: column; gap: 12px">
          <label for="axs-email" style="font-size: 13px; color: #B6C3EA; margin-bottom: -8px">Email</label>
          <input id="axs-email" type="email" inputmode="email" autocomplete="username" value="aisyah.rahman@reka.example" style="height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid rgba(157,184,255,.22); background: rgba(255,255,255,.04); color: #EAF0FF; padding: 0 12px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px">
          <label for="axs-pw" style="font-size: 13px; color: #B6C3EA; margin-bottom: -8px">Password</label>
          <span style="position: relative; display: flex">
            <input id="axs-pw" type="{{pwType}}" autocomplete="current-password" value="correct horse battery" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid rgba(157,184,255,.22); background: rgba(255,255,255,.04); color: #EAF0FF; padding: 0 64px 0 12px; font-family: inherit; font-size: 14px">
            <button type="button" onClick="{{togglePw}}" aria-pressed="{{pwPressed}}" style="position: absolute; right: 4px; top: 4px; height: 36px; min-width: 56px; border: 0; border-radius: 9px; background: transparent; color: #4D84FE; font-family: inherit; font-size: 13px; cursor: pointer">{{pwLabel}}</button>
          </span>
          <a href="#" style="align-self: flex-end; font-size: 13px; color: #4D84FE; text-decoration: none; margin-top: -4px">Forgot your password?</a>
          <button type="submit" class="axs-primary" style="width: 100%; min-height: 44px; border-radius: 12px; border: 0; background: #0459F7; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Sign in</button>
        </form>
      </sc-if>

      <sc-if value="{{isCode}}" hint-placeholder-val="{{false}}">
        <form onSubmit="{{verify}}" style="display: flex; flex-direction: column; gap: 12px">
          <p style="margin: 0; font-size: 13px; color: #B6C3EA; text-align: center; text-wrap: balance">{{codeLine}}</p>
          <label for="axs-code" style="font-size: 13px; color: #B6C3EA; margin-bottom: -8px">{{codeLabel}}</label>
          <input id="axs-code" type="text" inputmode="{{codeMode}}" autocomplete="one-time-code" value="{{codeValue}}" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid rgba(157,184,255,.22); background: rgba(255,255,255,.04); color: #EAF0FF; padding: 0 12px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 22px; letter-spacing: .3em; text-align: center">
          <button type="submit" class="axs-primary" style="width: 100%; min-height: 44px; border-radius: 12px; border: 0; background: #0459F7; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Sign in</button>
          <span style="display: flex; justify-content: space-between; gap: 12px; font-size: 13px">
            <button type="button" onClick="{{toggleBackup}}" style="border: 0; background: transparent; color: #4D84FE; font-family: inherit; font-size: 13px; cursor: pointer; padding: 0">{{backupLabel}}</button>
            <button type="button" onClick="{{back}}" style="border: 0; background: transparent; color: #B6C3EA; font-family: inherit; font-size: 13px; cursor: pointer; padding: 0">Use another account</button>
          </span>
        </form>
      </sc-if>

      <sc-if value="{{isIn}}" hint-placeholder-val="{{false}}">
        <p role="status" style="margin: 0; padding: 12px; border-radius: 12px; background: rgba(95,211,155,.10); border: 1px solid rgba(95,211,155,.35); color: #5FD39B; font-size: 13px; text-align: center">Signed in. Opening AXLE · {{product}}…</p>
        <button type="button" onClick="{{back}}" style="border: 0; background: transparent; color: #4D84FE; font-family: inherit; font-size: 13px; cursor: pointer">Start again</button>
      </sc-if>
    </section>

    <p style="margin: 0; display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #B6C3EA; text-align: center; max-width: 100%"><span class="axs-dot" aria-hidden="true" style="flex: none"></span><span style="min-width: 0">Authorised REKA staff · every action is recorded</span></p>
    <nav aria-label="Help and legal" style="display: flex; gap: 16px; font-size: 12px; margin-top: -10px">
      <a href="#" style="color: #B6C3EA; text-decoration: none">Help</a>
      <a href="#" style="color: #B6C3EA; text-decoration: none">Privacy</a>
      <a href="#" style="color: #B6C3EA; text-decoration: none">Terms</a>
    </nav>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"product":{"editor":"enum","options":["Janka","Yara","AX Frame","Angka","PLExyz Grid","Tinara","YaraOne"],"default":"Janka"},"start":{"editor":"enum","options":["signin","code","denied"],"default":"signin","section":"States"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: null, show: false, backup: false, google: false }; }
  renderVals() {
    var self = this, st = this.state;
    var step = st.step || (this.props.start ?? 'signin');
    var denied = step === 'denied';
    return {
      product: this.props.product ?? 'Janka',
      isSignIn: step === 'signin' || denied, isDenied: denied, isCode: step === 'code', isIn: step === 'in',
      googleLabel: st.google ? 'Opening Google…' : 'Continue with Google',
      google: function () { self.setState({ google: true }); },
      pwType: st.show ? 'text' : 'password', pwLabel: st.show ? 'Hide' : 'Show', pwPressed: st.show ? 'true' : 'false',
      togglePw: function () { self.setState({ show: !st.show }); },
      submit: function (e) { if (e && e.preventDefault) e.preventDefault(); self.setState({ step: 'code', backup: false }); },
      verify: function (e) { if (e && e.preventDefault) e.preventDefault(); self.setState({ step: 'in' }); },
      back: function () { self.setState({ step: 'signin', google: false, backup: false }); },
      codeLine: st.backup ? 'Type one of your 10 backup codes. Each works once.' : 'Type the 6-digit code from your authenticator app.',
      codeLabel: st.backup ? 'Backup code' : 'Code', codeMode: st.backup ? 'text' : 'numeric', codeValue: st.backup ? 'k7rq-2m9x' : '482 913',
      backupLabel: st.backup ? 'Use the app instead' : 'Use a backup code',
      toggleBackup: function () { self.setState({ backup: !st.backup }); }
    };
  }
}
</script>
</body>
</html>
