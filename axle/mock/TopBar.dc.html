<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>AntaraX top bar, AXLE variant</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="padding: 16px 28px 0; background: #F5F7FC; font-family: Poppins, ui-sans-serif, system-ui, sans-serif; color: #B6C3EA; font-size: 14px; line-height: 1.5">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; min-height: 64px; padding: 7px 10px 7px 7px; box-sizing: border-box; background: #0C1B47; border: 1px solid rgba(157,184,255,.22); border-radius: 24px; box-shadow: 0 10px 28px -18px rgba(7,18,51,.6)">
    <div style="display: flex; align-items: center; gap: 2px; padding: 4px; flex: none; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.10)">
      <a href="https://antarax.ai" aria-label="AntaraX" style="display: flex; align-items: center; justify-content: center; width: 34px; height: 40px; border-radius: 12px"><img src="/_blob/0371bde7c6755085b0a2bc82707aecb3" alt="" style="width: 22px; height: 22px; display: block"></a>
      <a href="Main.dc.html" aria-label="{{product}} AXLE home" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 8px; border-radius: 12px; background: rgba(255,255,255,.10); color: #FFFFFF; font-size: 17px; font-weight: 600; letter-spacing: -.02em; text-decoration: none; white-space: nowrap">
        <span style="width: 24px; height: 24px; border-radius: 6px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><img src="{{markUrl}}" alt="" style="max-width: 18px; max-height: 18px; display: block"></span>{{product}}
      </a>
    </div>
    <span style="flex: none; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: .12em; color: #071233; background: #FB9800; border-radius: 999px; padding: 3px 10px">AXLE</span>
    <h1 style="flex: 1 1 140px; min-width: 0; margin: 0; padding-left: 14px; border-left: 1px solid rgba(157,184,255,.16); color: #EAF0FF; font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{pageTitle}}</h1>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto">
      <span style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 6px 0 14px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.10)">
        <span style="font-size: 12px; color: #8E9CC9">Organisation</span>
        <span style="color: #EAF0FF; font-size: 14px; padding-right: 8px">{{orgScope}} ▾</span>
      </span>
      <button type="button" style="display: flex; align-items: center; gap: 10px; width: 240px; max-width: 100%; height: 44px; padding: 0 12px 0 14px; border-radius: 16px; border: 1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.05); color: #8E9CC9; font-family: inherit; font-size: 14px; cursor: pointer; text-align: left">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8E9CC9" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <span style="flex: 1">Find…</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; border: 1px solid rgba(157,184,255,.28); border-radius: 6px; padding: 1px 6px">⌘K</span>
      </button>
      <a href="R8.dc.html" aria-label="R8: 1 service failing" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(240,68,56,.45); background: rgba(240,68,56,.14); display: flex; align-items: center; justify-content: center; position: relative">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F7877F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"></path></svg>
        <span style="position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; border-radius: 999px; background: #F04438; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 11px; display: flex; align-items: center; justify-content: center">1</span>
      </a>
      <button type="button" aria-label="Staff menu" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); color: #EAF0FF; font-family: inherit; font-weight: 600; font-size: 13px; cursor: pointer">{{initials}}</button>
    </div>
  </header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pageTitle":{"editor":"text","default":"Overview"},"orgScope":{"editor":"text","default":"All organisations"},"initials":{"editor":"text","default":"AR"},"product":{"editor":"enum","options":["Janka","Yara","AX Frame","Angka","PLExyz Grid","Tinara"],"default":"Janka"},"$preview":{"width":1200,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    var product = this.props.product ?? 'Janka';
    var MARKS = { 'Janka': '/_blob/8757545247be33f643590d3dcfee0bb8', 'Yara': '/_blob/b5ffef229482a50345391de29cbfee0f', 'AX Frame': '/_blob/14ea05d2ed6655f1a0c7e460cb8fce0f', 'Angka': '/_blob/74ac0d107d262dbf7252396ab8eb230b', 'PLExyz Grid': '/_blob/39777292a881530041e7c4ac04e939a8', 'Tinara': '/_blob/cdaa47e69d5d2a13a1fb2a99e7572df9' };
    return { pageTitle: this.props.pageTitle ?? 'Overview', orgScope: this.props.orgScope ?? 'All organisations', initials: this.props.initials ?? 'AR', product: product, markUrl: MARKS[product] || MARKS['Janka'] };
  }
}
</script>
</body>
</html>
